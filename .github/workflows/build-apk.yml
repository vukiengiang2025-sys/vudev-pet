name: build-apk

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Unit tests (petcore)
        run: ./gradlew -Dorg.gradle.jvmargs=-Xmx2g --max-workers=2 :petcore:test

      - name: Assemble debug APK
        run: ./gradlew -Dorg.gradle.jvmargs=-Xmx2g --max-workers=2 :app:assembleDebug

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vudev-pet-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish rolling APK release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view latest-apk >/dev/null 2>&1; then
            gh release create latest-apk --title "VUDEV PET - ban moi nhat" --notes "APK debug tu dong tu nhanh main. Cai truc tiep tren dien thoai."
          fi
          gh release upload latest-apk app/build/outputs/apk/debug/app-debug.apk --clobber
